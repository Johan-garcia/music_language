services:
  db:
    image: postgres:16
    container_name: music_db
    environment:
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
      POSTGRES_DB: musicdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d musicdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - music-network
    restart: unless-stopped

  api:
    build:
      context: ./fastapi_template
      dockerfile: Dockerfile
    container_name: music_api
    depends_on:
      db:
        condition: service_healthy
    env_file: 
      - ./fastapi_template/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://music:music@db:5432/musicdb
      PYTHONPATH: /app
      YOUTUBE_API_KEY: AIzaSyCoytfOqpv8wN-B6YJgFEmvQyHboiC778E
      SPOTIFY_CLIENT_ID: 2c232ac5a4c245328e94668a9e0b0752
      SPOTIFY_CLIENT_SECRET: 38813e8beca548c5aa7f33c09a528d3b
      GENIUS_ACCESS_TOKEN: yomUGvA924AB4Q6RalPjqCwA-rO_XFkEJTy4mD3LuGZ_Q7zP5cXkNY0RBp2FDcth
      GENIUS_CLIENT_ID: CDSk3Pjh34h39XwbKpxc9RcKKNqh1n4MnrCylaeu6m1IgVvWBN48zejwG4sQmtP-
      GENIUS_CLIENT_SECRET: 5eoUp1o1Dy4jpsnZR0rpfdLfzKn6D4VBmCG8SopEGjdGVEHcG0YDkMOf5gzBC0yCiXFgVZsAP8qoeqvc58SH1A
      SECRET_KEY: IqQJH6iMqNHGYLPX56bynlnTic62xiE0WDCky0FLgUdbelVgu2lTirmwKmfAwT0B

      BACKEND_CORS_ORIGINS: "http://localhost:3000,http://localhost:80,http://frontend:80,http://3.94.46.86:3000,http://3.94.46.86:5173,http://3.94.46.86:8080"
    ports:
      - "8000:8000"
    volumes:
      - ./fastapi_template:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./react_frontend/frontend
      dockerfile: Dockerfile
    container_name: music_frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    networks:
      - music-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  pgdata:
    driver: local

networks:
  music-network:
    driver: bridge